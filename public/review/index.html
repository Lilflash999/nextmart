<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<title>Review - NextMart</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Inter', sans-serif;
    background: #f5f7fa;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.preview {
    width: 100%;
    max-width: 800px;
    margin: 20px auto;
}

.preview-body {
    background: #ffffff;
    border-radius: 24px;
    padding: 32px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
}

.product-img {
    position: relative;
    width: 100%;
    padding-top: 75%;
    background: #f9fafb;
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 24px;
}

.product-img .product-image {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 20px;
}

.left-arrow, .right-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 40px;
    height: 40px;
    background: rgba(255, 255, 255, 0.9);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s ease;
    color: #1a1a2e;
    font-size: 18px;
    z-index: 2;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
}

.left-arrow { left: 12px; }
.right-arrow { right: 12px; }

.left-arrow:hover, .right-arrow:hover {
    background: #FF9F00;
    color: #fff;
    transform: translateY(-50%) scale(1.1);
}

.image-count {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    z-index: 2;
}

.image-count span {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.5);
    transition: all 0.3s ease;
    cursor: pointer;
}

.image-count span.active {
    background: #FF9F00;
    transform: scale(1.3);
}

.product-details {
    margin-bottom: 24px;
}

.product-name {
    font-family: 'Inter', sans-serif;
    font-size: 24px;
    font-weight: 700;
    color: #1a1a2e;
    margin-bottom: 8px;
}

#product-desc {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: #6b7280;
    line-height: 1.6;
}

.border {
    border-top: 1px solid #e5e7eb;
    padding-top: 24px;
}

.review-stars {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
}

.review-stars span {
    font-size: 20px;
    color: #d1d5db;
    cursor: pointer;
    transition: color 0.3s ease;
}

.review-stars span.active {
    color: #fbbf24;
}

.review-stars span:hover {
    color: #fbbf24;
}

#previews h4 {
    font-family: 'Inter', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: #1a1a2e;
    margin-bottom: 16px;
}

.time-cat {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: #6b7280;
    margin-bottom: 12px;
}

.time-cat .date {
    font-weight: 600;
    color: #1a1a2e;
}

#previewContainer {
    max-height: 400px;
    overflow-y: auto;
    margin-bottom: 16px;
    padding-right: 8px;
}

#previewContainer::-webkit-scrollbar {
    width: 6px;
}

#previewContainer::-webkit-scrollbar-track {
    background: #f3f4f6;
    border-radius: 10px;
}

#previewContainer::-webkit-scrollbar-thumb {
    background: #FF9F00;
    border-radius: 10px;
}

.preview-box {
    background: #f9fafb;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 12px;
    border-left: 3px solid #FF9F00;
}

.preview-details {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
}

.previewer-img {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #FF9F00;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: #fff;
    flex-shrink: 0;
}

.previewer-name {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    color: #1a1a2e;
}

#comment-msg .comment-msg {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: #4b5563;
    line-height: 1.5;
}

.time-sent {
    margin-top: 4px;
}

.sent-time {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    color: #9ca3af;
}

#previewInput {
    display: flex;
    gap: 10px;
    align-items: flex-end;
}

.input-preview {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.preview-input {
    width: 100%;
    padding: 12px 14px;
    border: 2px solid #e5e7eb;
    border-radius: 12px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    resize: vertical;
    min-height: 60px;
    transition: all 0.3s ease;
    background: #fafafa;
}

.preview-input:focus {
    outline: none;
    border-color: #FF9F00;
    background: #ffffff;
    box-shadow: 0 0 0 4px rgba(255, 159, 0, 0.1);
}

.user-id {
    padding: 10px 14px;
    border: 2px solid #e5e7eb;
    border-radius: 12px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    background: #fafafa;
    cursor: pointer;
    transition: all 0.3s ease;
}

.user-id:focus {
    outline: none;
    border-color: #FF9F00;
}

.send-preview {
    padding: 12px 24px;
    background: #FF9F00;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
    height: fit-content;
}

.send-preview:hover {
    background: #e68a00;
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(255, 159, 0, 0.3);
}

.send-preview:active {
    transform: scale(0.95);
}

.spinner-overlay {
    position: fixed;
    width: 100%;
    top: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    height: 100vh;
    background: rgba(0,0,0,0.07);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 6;
}

.spinner-overlay.show {
    display: flex;
}

#spinnerBody {
   position: relative;
    width: 55vw;
    height: auto;
    min-height: 25vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 22px;
}

.spinner {
    width: 60px;
    height: 60px;
    background: #FF9F00;
    border-radius: 50%;
    display: flex;
    align-items: center;
    overflow: hidden;
    justify-content: center;
    animation: spin 1.5s ease-in-out infinite;
}

.spinner img {
    width: 80%;
    height: 80%;
    object-fit: cover;
    border-radius: 50%;
}

@keyframes spin {
    0% { transform: scale(0.2); opacity: 0.4; }
    50% { transform: scale(1); opacity: 1; }
    100% { transform: scale(0.2); opacity: 0.4; }
}

.loading-text {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    gap: 8px;
    font-size: 12px;
    line-height: 1.4;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-family: 'Orbitron', sans-serif;
    color: #000;
    font-style: italic;
    opacity: 1;
    letter-spacing: -0.02rem;
}

.loading-dots {
    display: flex;
    gap: 8px;
    justify-content: center;
    align-items: center;
    margin-top: 8px;
}

.loading-dots span {
    width: 4px;
    height: 4px;
    background: #000;
    border-radius: 50%;
    animation: dotBounce 1.4s ease-in-out infinite both;
}

.loading-dots span:nth-child(1) { animation-delay: -0.32s; }
.loading-dots span:nth-child(2) { animation-delay: -0.16s; }
.loading-dots span:nth-child(3) { animation-delay: 0s; }

@keyframes dotBounce {
    0%, 80%, 100% { opacity: 0.2; }
    40% { transform: scale(1); opacity: 1; }
}

.toast-message {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 24px;
    border-radius: 12px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    z-index: 9999;
    animation: slideUp 0.3s ease;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    max-width: 90%;
    text-align: center;
}

.toast-success { background: #10b981; color: #fff; }
.toast-error { background: #ef4444; color: #fff; }
.toast-info { background: #3b82f6; color: #fff; }

@keyframes slideUp {
    from { opacity: 0; transform: translateX(-50%) translateY(20px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
}

@keyframes slideDown {
    from { opacity: 1; transform: translateX(-50%) translateY(0); }
    to { opacity: 0; transform: translateX(-50%) translateY(20px); }
}

@media (max-width: 480px) {
    .preview-body { padding: 16px; }
    .product-name { font-size: 20px; }
    #previewInput { flex-direction: column; }
    .send-preview { width: 100%; justify-content: center; }
    .left-arrow, .right-arrow { width: 32px; height: 32px; font-size: 14px; }
}
</style>
</head>
<body>
    <div class="preview">
        <div class="preview-body">
            <div class="product-img">
                <div class="left-arrow">
                    <i class="fas fa-chevron-left"></i>
                </div>
                <img class="product-image" src="/avatar.jpg" alt="Product Image" />
                <div class="right-arrow">
                    <i class="fas fa-chevron-right"></i>
                </div>
                <div class="image-count">
                    <span></span>
                    <span></span>
                </div>
            </div>
            <div class="product-details">
                <div class="product-name" id="productName">Just a image</div>
                <div id="product-desc">
                    <span class="product-desc" id="productDesc">This is crazy to be honest, what can I get you silly ass, you're are nothing but a dumb dumb</span>
                </div>
            </div>
            <div class="border">
                <div class="review-stars" id="starContainer">
                    <span data-value="1"><i class="fas fa-star"></i></span>
                    <span data-value="2"><i class="fas fa-star"></i></span>
                    <span data-value="3"><i class="fas fa-star"></i></span>
                    <span data-value="4"><i class="fas fa-star"></i></span>
                    <span data-value="5"><i class="fas fa-star"></i></span>
                </div>
                <div id="previews">
                    <h4>Previews</h4>
                    <div class="time-cat"></div>
                    <div id="previewContainer"></div>
                    <div id="previewInput">
                        <div class="input-preview">
                            <textarea autocomplete="off" autocorrect="off" class="preview-input" placeholder="Write your review..."></textarea>
                            <select class="user-id" id="userIdSelect">
                                <option selected>select ID</option>
                                <option value="Anonymous">Anonymous</option>
                                <option value="Your ID">Your ID</option>
                            </select>
                        </div>
                        <button class="send-preview" id="sendReview">
                            <span>Send <i class="fas fa-paper-plane"></i></span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="spinner-overlay" id="spinnerOverlay">
        <div id="spinnerBody">
            <div class="spinner">
                <img src="https://www.image2url.com/r2/default/images/1786155032456-4fb0f25a-f843-43f2-be11-74a78866f22a.jpeg" alt="image" />
            </div>
            <div>
                <span class="loading-text">
                    Loading
                    <div class="loading-dots">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </span>
            </div>
        </div>
    </div>
   <script src="./main.js"></script>
</body>
</html>
